<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>

    <!-- Accent Gradients with Dynamic Cycling Animation -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe; #4facfe; #00c6ff; #00f2fe" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe; #0072ff; #00f2fe; #4facfe" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>

    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3b5c"/>
      <stop offset="100%" stop-color="#182438"/>
    </linearGradient>

    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.3px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #00f2fe;
    }
    .pulse-dot {
      animation: pulse 2.5s infinite ease-in-out;
    }
    .dash-line {
      stroke-dasharray: 8 6;
      animation: dashMove 20s linear infinite;
    }
    .float-box {
      animation: float 4s ease-in-out infinite;
    }
    .float-box-2 {
      animation: float 4s ease-in-out infinite 2s;
    }
    @keyframes dashMove {
      to {
        stroke-dashoffset: -200;
      }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect width="1196" height="376" x="2" y="2" rx="15" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1.5"/>

  <!-- Isometric Warehouse / Automation Graphics (Right side) -->
  <g transform="translate(820, 70)">
    <!-- Circuit & Flow Lines -->
    <path class="dash-line" d="M -150 140 L -40 140 L 40 220 L 220 220" fill="none" stroke="rgba(0, 242, 254, 0.4)" stroke-width="2"/>
    <path class="dash-line" d="M -80 80 L 100 80 L 160 140 L 260 140" fill="none" stroke="rgba(255, 153, 0, 0.4)" stroke-width="2"/>

    <!-- High-tech Isometric Rack / Cube System Platform -->
    <polygon points="120,240 280,160 160,100 0,180" fill="rgba(15, 32, 67, 0.8)" stroke="#00c6ff" stroke-width="1.5"/>
    <polygon points="0,180 120,240 120,260 0,200" fill="rgba(10, 20, 45, 0.9)" stroke="rgba(0, 198, 255, 0.5)" stroke-width="1"/>
    <polygon points="120,240 280,160 280,180 120,260" fill="rgba(6, 13, 30, 0.9)" stroke="rgba(0, 198, 255, 0.5)" stroke-width="1"/>

    <!-- Warehouse Storage Cubes / Pallets Layer 1 -->
    <g class="float-box">
      <polygon points="40,150 90,125 50,105 0,130" fill="url(#boxGrad2)" opacity="0.9"/>
      <polygon points="0,130 40,150 40,180 0,160" fill="#0052cc"/>
      <polygon points="40,150 90,125 90,155 40,180" fill="#003d99"/>
      <line x1="12" y1="145" x2="28" y2="153" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    </g>

    <!-- Box 2 (Autonomous Mobile Robot / Automated Unit) -->
    <g class="float-box-2">
      <polygon points="120,190 170,165 130,145 80,170" fill="url(#orangeGrad)" opacity="0.95"/>
      <polygon points="80,170 120,190 120,215 80,195" fill="#cc4400"/>
      <polygon points="120,190 170,165 170,190 120,215" fill="#993300"/>
      <circle cx="120" cy="190" r="3" fill="#00f2fe" filter="url(#subtleGlow)"/>
    </g>

    <!-- Box 3 (High Rack Layer) -->
    <g class="float-box">
      <polygon points="170,120 220,95 180,75 130,100" fill="url(#boxGrad1)" stroke="rgba(0, 242, 254, 0.6)" stroke-width="1"/>
      <polygon points="130,100 170,120 170,150 130,130" fill="#121b2d"/>
      <polygon points="170,120 220,95 220,125 170,150" fill="#0b1220"/>
      <line x1="180" y1="108" x2="210" y2="93" stroke="#00f2fe" stroke-width="2" filter="url(#subtleGlow)"/>
    </g>

    <!-- Conveyor Belt Animation Vector -->
    <polygon points="60,80 180,20 150,5 30,65" fill="rgba(0, 242, 254, 0.15)" stroke="rgba(0, 242, 254, 0.4)" stroke-dasharray="4 4"/>
    
    <!-- Connectivity Nodes -->
    <circle cx="0" cy="130" r="4" fill="#00f2fe" class="pulse-dot" filter="url(#glow)"/>
    <circle cx="120" cy="240" r="4" fill="#ff9900" class="pulse-dot" filter="url(#glow)"/>
    <circle cx="280" cy="160" r="4" fill="#00f2fe" class="pulse-dot" filter="url(#glow)"/>
    <circle cx="160" cy="100" r="4" fill="#4facfe" class="pulse-dot" filter="url(#glow)"/>
  </g>

  <!-- Left Content / Typography -->
  <g transform="translate(70, 75)">
    <!-- Category Pill Badge -->
    <rect width="220" height="30" rx="15" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1"/>
    <circle cx="15" cy="15" r="4" fill="#00f2fe" filter="url(#glow)"/>
    <text x="30" y="20" class="badge-text">WMS ECOSYSTEM • 2026</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">
      Awesome <tspan fill="url(#accentGrad)">Warehouse</tspan>
    </text>
    <text x="0" y="140" class="title">
      Management <tspan fill="#ff9900">Systems</tspan>
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="185" class="subtitle">
      Curated SaaS Platforms, Open-Source WMS &amp; Logistics Automation
    </text>

    <!-- Tags Row -->
    <g transform="translate(0, 215)">
      <!-- Tag 1 -->
      <rect width="135" height="30" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="14" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">📦 SaaS Platforms</text>

      <!-- Tag 2 -->
      <rect x="145" width="150" height="30" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="159" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ Open-Source WMS</text>

      <!-- Tag 3 -->
      <rect x="305" width="140" height="30" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="319" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🤖 Automation &amp; 3PL</text>

      <!-- Tag 4 -->
      <rect x="455" width="145" height="30" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="469" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">📊 Pricing &amp; Metrics</text>
    </g>
  </g>
</svg>
